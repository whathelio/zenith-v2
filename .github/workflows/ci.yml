# Zenith v2 持续集成
#
# 2026-10-04 新建。此前 468 个测试**没有任何强制执行点**：
# `.pre-commit-config.yaml` 只跑 ruff lint、不跑测试，且是 local hook
# —— 未执行 `pre-commit install` 的克隆完全没有质量门禁。
#
# 平台选 windows-latest 而非 ubuntu：项目含 Windows 专有逻辑
# （火绒/WAL 保活、PowerShell 进程采集、MT5 桥接），
# 用 Linux runner 会产生与生产环境无关的假失败。
#
# 本地复现同一套检查：
#   .venv/Scripts/python.exe -m pytest tests/ -q --timeout=120 --cov=backend
#   .venv/Scripts/ruff.exe check .
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 准备测试配置
        shell: pwsh
        run: |
          # config/config.yaml 不入库（含密钥），从 example 复制一份供测试读取。
          # conftest.py 随后会把它拷到 %TEMP% 并在会话结束时清理。
          if (-not (Test-Path config/config.yaml)) {
            Copy-Item config/config.yaml.example config/config.yaml
          }

      # 硬门禁：2026-10-14 存量 lint 已全部清零（22 处：F401/F541/F841），
      # 删除 --exit-zero → 任何新增 lint 违规都会直接让 CI 失败。
      - name: Lint
        run: ruff check .

      - name: 测试与覆盖率
        run: pytest tests/ -q --timeout=120 --cov=backend --cov-report=term

  # 2026-10-17 新增（审计 0.5 / B4-R3）：此前 CI **只检查后端**，前端零门禁。
  # 后果见审计 0-1：`api.ts` 声明了 4 个后端从不返回的字段，tsc 全程放行，
  # 直到用户点一次「⇄ 转化为」才整站白屏。前端类型检查必须是硬门禁。
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # 用 `npm install` 而不是 `npm ci`：package-lock.json 里有一条幽灵依赖
      # （lucide-react，见审计 B4-S8），`npm ci` 会因 lock 与 package.json 不一致直接失败。
      # 修好 lock 之后应改回 `npm ci`（更快、可复现）。
      - name: 安装依赖
        run: npm install --no-audit --no-fund

      - name: 类型检查（硬门禁）
        run: npm run typecheck
