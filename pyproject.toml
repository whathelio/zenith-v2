[tool.ruff]
target-version = "py313"
line-length = 120
# 排除非源码目录（虚拟环境 / 前端构建产物 / 归档 / 已封存模块）
extend-exclude = [".venv", "frontend", "_archive", "_archived", "node_modules"]

[tool.ruff.lint]
# 只启用「真正的错误」类规则，暂缓风格规则（存量代码有大量中文注释/长行，
# 一次性引入风格规则会产生海量告警，干扰真正的 bug 发现）
select = ["F", "E4", "E7", "E9"]
ignore = [
    "E501",  # 行长度由 formatter 处理
    "E402",  # 模块级延迟 import（规避 tools/confirm_flow 循环依赖，刻意思路）
    "E702",  # 单行多语句分号（压缩代码风格，有意）
    "E741",  # 模糊变量名 l/I/O（数学/循环惯用）
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# 现有测试已显式标注 @pytest.mark.asyncio，此处兜底兼容未标注的 async 测试
asyncio_mode = "auto"
